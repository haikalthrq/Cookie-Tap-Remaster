<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Cookie Tap</title>
  <link rel="icon" href="{{url_for('static', filename='assets/pngegg.png')}}" type="image/png">
  <link rel="stylesheet" href="{{url_for('static', filename='style-reg.css')}}">
</head>
<body>
  <!-- Fixed Arcade Header -->
  <header class="arcade-header">
    <div class="header-branding">
      <img class="header-logo" src="{{url_for('static', filename='assets/pngegg.png')}}" alt="Cookie Tap Logo">
      <h1 class="header-title"><a href="/">Cookie Tap</a></h1>
    </div>
    <div class="header-actions">
      <a href="/leaderboard" class="ds-btn-secondary">Leaderboards</a>
    </div>
  </header>

  <!-- Ambient Hybrid Arcade Backdrop -->
  <div class="arcade-ambient-backdrop" aria-hidden="true">
    <div class="ambient-neon-pillar-left"></div>
    <div class="ambient-neon-pillar-right"></div>
    <div class="ambient-grid-floor"></div>
    <div class="floating-cookie-stream">
      <span class="ambient-cookie c1">&#127850;</span>
      <span class="ambient-star s1">&#10024;</span>
      <span class="ambient-cookie c2">&#127850;</span>
      <span class="ambient-star s2">&#11088;</span>
      <span class="ambient-cookie c3">&#127850;</span>
      <span class="ambient-star s3">&#10024;</span>
      <span class="ambient-cookie c4">&#127850;</span>
      <span class="ambient-star s4">&#11088;</span>
      <span class="ambient-cookie c5">&#127850;</span>
    </div>
  </div>

  <!-- Centered Auth Stage -->
  <main class="auth-stage">
    <section class="arcade-cabinet-box" aria-label="Player Registration Cabinet">
      <div class="cabinet-marquee">
        <span class="arcade-pill">NEW PLAYER</span>
        <span class="blinking-prompt">&#9733; CREATE PROFILE &#9733;</span>
        <span class="arcade-pill">PRESS START</span>
      </div>

      <div class="cabinet-screen">
        <div class="auth-header">
          <h2 class="auth-title">PLAYER REGISTRATION</h2>
          <p class="auth-subtitle">Create an account to save your scores and join the leaderboard.</p>
        </div>

        <div id="authNotice" class="ds-notice" role="alert"></div>

        <form class="auth-form" id="regForm" onsubmit="event.preventDefault(); submitRegister();">
          <div class="ds-field-wrapper">
            <label class="ds-field-label" for="usernameInput">USERNAME (MAX 15 CHARS)</label>
            <input id="usernameInput" class="ds-field-input" type="text" maxlength="15" placeholder="Choose a player username" required autocomplete="username">
          </div>

          <div class="ds-field-wrapper">
            <label class="ds-field-label" for="passwordInput">PASSWORD (MAX 15 CHARS)</label>
            <input id="passwordInput" class="ds-field-input" type="password" maxlength="15" placeholder="Choose a password" required autocomplete="new-password">
          </div>

          <button type="submit" id="submitBtn" class="ds-btn-action">
            &#9654; REGISTER ACCOUNT
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="/login" class="auth-link" onclick="playBtnAudio()">Login here</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const sfxButton = new Audio("{{url_for('static', filename='assets/button_tap.mp3')}}");

    function playBtnAudio() {
      sfxButton.currentTime = 0;
      sfxButton.play().catch(() => {});
    }

    function submitRegister() {
      playBtnAudio();
      const usernameInput = document.getElementById("usernameInput");
      const passwordInput = document.getElementById("passwordInput");
      const notice = document.getElementById("authNotice");
      const submitBtn = document.getElementById("submitBtn");

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        notice.textContent = "Please fill in both fields.";
        notice.className = "ds-notice error";
        return;
      }

      if (username.length > 15 || password.length > 15) {
        notice.textContent = "Username and password must not exceed 15 characters.";
        notice.className = "ds-notice error";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Registering...";

      const payload = JSON.stringify({ request: [username, password] });
      fetch('/registers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      })
      .then(res => res.json())
      .then(data => {
        submitBtn.disabled = false;
        submitBtn.textContent = "REGISTER ACCOUNT";
        if (data.respond === "succes") {
          localStorage.setItem("username", username);
          localStorage.setItem("password", password);
          localStorage.setItem("cookies", 0);
          notice.textContent = "Account created successfully! Entering cookie arena...";
          notice.className = "ds-notice success";
          setTimeout(() => location.replace("/cookie"), 400);
        } else if (data.respond === "existed") {
          notice.textContent = "Username already taken! Please choose another name.";
          notice.className = "ds-notice error";
        } else {
          notice.textContent = "Registration failed. Please try again.";
          notice.className = "ds-notice error";
        }
      })
      .catch(err => {
        submitBtn.disabled = false;
        submitBtn.textContent = "REGISTER ACCOUNT";
        notice.textContent = "Network error. Please try again.";
        notice.className = "ds-notice error";
        console.error(err);
      });
    }
  </script>
</body>
</html>
