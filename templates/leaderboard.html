<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hall of Fame Leaderboard | Cookie Tap</title>
  <link rel="icon" href="{{url_for('static', filename='img/pngegg.png')}}" type="image/png">
  <link rel="stylesheet" href="{{url_for('static', filename='css/style-leaderboard.css')}}">
</head>
<body>
  <!-- Fixed Arcade Header -->
  <header class="arcade-header">
    <div class="header-branding">
      <img class="header-logo" src="{{url_for('static', filename='img/pngegg.png')}}" alt="Cookie Tap Logo">
      <h1 class="header-title"><a href="/">Cookie Tap</a></h1>
    </div>
    <div class="header-actions">
      <a href="/cookie" class="ds-btn-action" onclick="playBtnAudio()">&#9654; Back to Game</a>
      <a id="navUserBtn" href="/cookie" class="ds-btn-secondary" onclick="playBtnAudio()">
        &#128100; <span id="navUserLabel">ACCOUNT</span>
      </a>
    </div>
  </header>

  <!-- Ambient Hybrid Arcade Backdrop -->
  <div class="arcade-ambient-backdrop" aria-hidden="true">
    <div class="ambient-neon-pillar-left"></div>
    <div class="ambient-neon-pillar-right"></div>
    <div class="ambient-grid-floor"></div>
    <div class="floating-cookie-stream">
      <span class="ambient-cookie c1">&#127850;</span>
      <span class="ambient-star s1">&#10024;</span>
      <span class="ambient-cookie c2">&#127850;</span>
      <span class="ambient-star s2">&#11088;</span>
      <span class="ambient-cookie c3">&#127850;</span>
      <span class="ambient-star s3">&#10024;</span>
      <span class="ambient-cookie c4">&#127850;</span>
      <span class="ambient-star s4">&#11088;</span>
      <span class="ambient-cookie c5">&#127850;</span>
    </div>
  </div>

  <!-- Leaderboard Main Stage -->
  <main class="leaderboard-stage">
    <!-- Top High-Score Marquee Ticker -->
    <aside class="arcade-ticker-bar" aria-label="Arcade Leaderboard Announcement">
      <div class="ticker-tag">&#128081; ALL-TIME HIGH SCORE</div>
      <div id="topPlayerTicker" class="ticker-text">LOADING CHAMPION...</div>
    </aside>

    <!-- Main Retro Arcade Cabinet Container -->
    <section class="arcade-cabinet-box" aria-label="Hall of Fame Cabinet">
      <div class="cabinet-marquee">
        <span class="arcade-pill">HALL OF FAME</span>
        <span class="blinking-prompt">&#9733; TOP BAKERS &#9733;</span>
        <span id="playerCountBadge" class="arcade-pill">PLAYERS: --</span>
      </div>

      <div class="cabinet-screen">
        <div class="leaderboard-intro">
          <h2 class="leaderboard-title">COMMUNITY RANKINGS &#127942;</h2>
          <div class="refresh-indicator">
            <span class="refresh-dot"></span>
            <span>Live auto-syncing</span>
          </div>
        </div>

        <div id="rankingsContainer" class="ranking-list" role="list">
          <div class="loading-notice">&#9203; Fetching high scores from the vault...</div>
        </div>

        <div class="leaderboard-footer-cta">
          <a href="/cookie" class="ds-btn-action" onclick="playBtnAudio()">&#9654; PLAY NOW &amp; CLIMB RANKINGS</a>
        </div>
      </div>
    </section>
  </main>

  <script src="{{url_for('static', filename='js/leaderboard.js')}}" defer></script>
</body>
</html>
